<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해봤노트 · 외대人사이드</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  /* 해봤노트 화면 배치용. 색은 style.css 변수만 쓴다. */

  /* ---------- 목록(1단계) ---------- */
  .note-top { display: flex; flex-direction: column; gap: var(--space-md); }
  /* 노트 검색창(7-③, 11/24): 해봤노트 안에서 프로그램·나라·기관으로 거른다. 돋보기는 입력칸 안 왼쪽, 지우기(×)는 오른쪽 */
  .note-search { position: relative; }
  .note-search .input { width: 100%; padding-left: 44px; padding-right: 48px; }
  .note-search__icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-hufs-navy); pointer-events: none; }
  .note-search__clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }
  .note-search__clear .icon { color: var(--color-text-muted); }
  /* 검색창 기본 지우기 버튼은 숨기고(브라우저마다 모양이 달라서) 우리 × 버튼만 쓴다 */
  .note-search input::-webkit-search-cancel-button { display: none; }
  /* [11/27] 필터 칩 압축: 글자 13px·좌우 12px·간격 6px. 높이(터치 영역)는 44px 그대로. 가로 스크롤은 쓰지 않는다 */
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-row .choice-chip { gap: var(--space-xs); padding: 0 12px; font-size: 13px; cursor: pointer; }
  .filter-row .choice-chip .icon { width: 16px; height: 16px; }
  /* 분야 아래 2단 칩(권역·나라·기관 유형): 12px · 보이는 높이 32px, 터치 영역은 ::after로 위아래 6px씩 넓혀 44px.
     줄 간격 12px라 위아래 칩의 터치 영역이 겹치지 않는다(11/27 #382-2 A안) */
  #groupChips, #groupChips + .filter-row { gap: 12px 6px; }
  #groupChips .choice-chip, #groupChips + .filter-row .choice-chip { position: relative; min-height: 32px; padding: 0 10px; font-size: 12px; }
  #groupChips .choice-chip::after, #groupChips + .filter-row .choice-chip::after { content: ""; position: absolute; inset: -6px 0; }
  .note-count { margin-top: var(--space-lg); font-size: var(--font-size-secondary); color: var(--color-text-muted); }
  .note-list { display: flex; flex-direction: column; gap: 12px; margin-top: var(--space-sm); }
  .note-skeleton { height: 168px; }
  /* 카드 본문 전체가 상세로 가는 링크(띠의 스크랩 버튼은 따로) */
  a.note-card__body { color: inherit; text-decoration: none; }
  .state-box { display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); padding: var(--space-lg) 0; text-align: center; }
  .state-box__title { font-size: var(--font-size-card-title); font-weight: 600; color: var(--color-heading); }
  .state-box .boo-illust { width: 80px; height: 80px; }

  /* ---------- 상세(2단계) ---------- */
  .detail { display: flex; flex-direction: column; gap: var(--space-lg); }
  /* 노트 틀 탭: 칸이 많으면 가로 스크롤(5-7과 같은 방식) */
  .section-tabs {
    position: relative;
    display: flex;
    gap: var(--space-sm);
    margin: 0 calc(-1 * var(--page-gutter));
    padding: 0 var(--page-gutter) var(--space-xs);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .section-tabs::-webkit-scrollbar { display: none; }
  .section-tabs .choice-chip { flex: none; font-size: var(--font-size-secondary); cursor: pointer; }
  .section-tabs .choice-chip[aria-selected="true"] { border-color: transparent; background: var(--color-hufs-navy); color: var(--color-on-primary); }
  .section-panel { display: flex; flex-direction: column; gap: 12px; }
  /* 칸 문장(원문 인용) */
  .line {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    padding: var(--space-md);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    background: var(--color-surface);
  }
  .line__meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-xs) var(--space-sm); font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .line__meta .icon-btn { margin-left: auto; color: var(--color-text-muted); }
  .line__meta .icon-btn .icon { width: 20px; height: 20px; }
  /* 배운점: 선배 말을 그대로 옮긴 인용 */
  .line--quote .line__text { padding-left: 12px; border-left: 3px solid var(--color-border); }
  .detail-skeleton { height: 120px; }
  /* 칸별 요약 문단(작업 78): 소제목 → 문단(문장 끝 출처 연도). 원문 접기는 11/25 삭제(#266) */
  .summary {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    padding: var(--space-md);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    background: var(--color-surface);
  }
  .summary__title { font-size: var(--font-size-card-title); font-weight: 600; color: var(--color-heading); }
  /* [11/26 #321] 요약 개조식: 문장마다 한 줄(점) + 아래 출처 연도·「보고서 N건」. 생활·지원은 소주제 라벨로 묶음 */
  .summary__list { display: flex; flex-direction: column; gap: var(--space-sm); margin: 0; padding-left: 20px; list-style: disc; }
  .summary__item { line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
  .summary__item::marker { color: var(--color-text-muted); }
  .summary__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-sm); margin-top: 2px; }
  .summary__from { font-size: var(--font-size-caption); color: var(--color-text-muted); white-space: nowrap; }
  .summary__count {
    display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--radius-pill);
    background: var(--status-neutral-bg); color: var(--status-neutral-fg); font-size: var(--font-size-caption); white-space: nowrap;
  }
  .summary__group { display: flex; flex-direction: column; gap: var(--space-xs); }
  .summary__group + .summary__group { margin-top: var(--space-xs); }
  .summary__topic { margin: 0; font-size: var(--font-size-secondary); font-weight: 600; color: var(--color-heading); }
  /* 소주제가 안 잡힌 문장: 라벨 없이 맨 뒤(spec), 앞 묶음과 섞여 보이지 않게 구분선 */
  .summary__list--rest { padding-top: var(--space-sm); border-top: 1px solid var(--color-border); }
  /* [11/26 #321] 비용 칸 stats: 한 줄 + 분포 띠. 코드 집계라 중립색만(HUFS GREEN·SOFT MINT 금지) */
  .stats { display: flex; flex-direction: column; gap: var(--space-xs); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-card); background: var(--color-neutral-bg); }
  .stats__line { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-xs) var(--space-sm); }
  .stats__range { font-size: var(--font-size-card-title); font-weight: 600; color: var(--color-heading); }
  .stats__sub { font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .stats__strip { display: block; width: 100%; height: 28px; overflow: visible; }
  .stats__axis { stroke: var(--color-border); stroke-width: 4; stroke-linecap: round; }
  .stats__tick { stroke: var(--status-neutral-fg); stroke-width: 2; }
  .stats__dot { stroke: var(--status-neutral-fg); stroke-opacity: .55; stroke-width: 8; stroke-linecap: round; }
  .stats__strip line { vector-effect: non-scaling-stroke; }
  .stats__median { stroke: var(--color-hufs-navy); stroke-width: 3; stroke-linecap: round; }
  .stats__ends { display: flex; justify-content: space-between; font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .summary-new__title {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: var(--space-sm);
    font-size: var(--font-size-secondary);
    font-weight: 600;
    color: var(--color-heading);
  }
  .summary-new__title .icon { width: 16px; height: 16px; color: var(--color-ai); }
  /* [11/25 #266] 요약 문장 신고: 문장 키보드 포커스, 안내 한 줄, 선택 끝 「신고하기」 풍선(위험 버튼 색, 5-4) */
  .summary__sentence:focus-visible { outline: none; border-radius: 4px; box-shadow: var(--focus-ring); }
  .summary__hint { display: flex; align-items: center; gap: var(--space-xs); font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .summary__hint .icon { width: 14px; height: 14px; flex: none; }
  /* [11/26] 고른 요약 문장(문장 하나 전체): 빨간 글자 + 빨간 밑줄 — 여러 줄이어도 문장 전체(8-1 ③) */
  .summary__sentence--picked { color: var(--status-error-fg); text-decoration: underline; text-decoration-color: var(--status-error-fg); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  /* 요약 문장은 브라우저 글자 선택(휴대폰 단어 잡기·PC 여러 문장 드래그)·길게 누르기 메뉴를 끄고 문장 하나 단위로 고른다(note.js 8-1) */
  .summary__sentence[tabindex] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* 고른 문장 끝 풍선: 「복사」(외곽선 버튼 5-4) + 「신고하기」(위험 버튼, 그대로) */
  .sentence-pop { position: absolute; z-index: 20; display: flex; gap: var(--space-sm); }
  .sentence-pop[hidden] { display: none; }
  .copy-bubble {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    min-height: 44px;
    padding: 0 var(--space-md);
    border: 1px solid var(--color-hufs-navy);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-hufs-navy);
    font: inherit;
    font-size: var(--font-size-secondary);
    font-weight: 600;
    box-shadow: var(--shadow-float);
    cursor: pointer;
  }
  .copy-bubble .icon { width: 16px; height: 16px; }
  .copy-bubble:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .copy-scratch { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
  .report-bubble {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    min-height: 44px;
    padding: 0 var(--space-md);
    border: 1px solid var(--status-error-fg);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--status-error-fg);
    font: inherit;
    font-size: var(--font-size-secondary);
    font-weight: 600;
    box-shadow: var(--shadow-float);
    cursor: pointer;
  }
  .report-bubble .icon { width: 16px; height: 16px; }
  .report-bubble:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  /* 신고 시트: 무엇을 신고하는지 문장을 인용으로 */
  .report-quote { padding: 12px var(--space-md); border-left: 3px solid var(--color-border); background: var(--color-background); border-radius: 0 var(--radius-card) var(--radius-card) 0; font-size: var(--font-size-secondary); line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 1단계: 해봤노트 목록 (메인 헤더 + 하단 탭) ===== -->
  <section id="viewList" class="has-tabbar">
    <header class="header">
      <a class="header__brand" href="../talk/">
        <img class="header__symbol" src="../../assets/hufs-symbol.gif" alt="HUFS 심벌">
        외대人사이드
      </a>
      <div class="header__actions">
        <!-- 직원 계정일 때만 보임(5-1): PC 관리자 콘솔을 새 탭으로 -->
        <a class="icon-btn" id="consoleBtn" href="../admin/" target="_blank" rel="noopener" aria-label="관리자 콘솔" hidden><i data-lucide="chart-column" class="icon"></i></a>
        <!-- 후속 개발 및 확장방안(11/27): 누르면 screens/info/roadmap.md를 시트로 — screens/info/info.js -->
        <button class="icon-btn icon-btn--muted" id="infoBtn" type="button" aria-label="후속 개발 및 확장방안" aria-haspopup="dialog"><i data-lucide="info" class="icon"></i></button>
        <a class="icon-btn" id="bellBtn" href="../questions/#alerts" aria-label="알림"><i data-lucide="bell" class="icon"></i><span class="icon-btn__dot" id="bellDot" hidden></span></a>
      </div>
    </header>

    <main class="page">
      <div class="note-top">
        <div class="page-intro__text">
          <h1 class="page-title">해봤노트</h1>
          <p class="sub">이수 기록으로 확인된 선배들의 경험을 프로그램별로 모았어요.</p>
        </div>

        <form class="note-search" id="noteSearch" role="search" autocomplete="off">
          <i data-lucide="search" class="icon note-search__icon" aria-hidden="true"></i>
          <input class="input" id="noteQuery" type="search" enterkeyhint="search" maxlength="40"
                 aria-label="해봤노트 검색" placeholder="프로그램·나라·기관 이름으로 찾기">
          <button class="icon-btn note-search__clear" id="noteQueryClear" type="button" aria-label="검색어 지우기" hidden>
            <i data-lucide="x" class="icon"></i>
          </button>
        </form>

        <div class="filter-row" id="filters" role="group" aria-label="분야 필터">
          <button class="choice-chip" type="button" data-cat="" aria-pressed="true">전체</button>
          <button class="choice-chip" type="button" data-cat="global" aria-pressed="false">국제교류</button>
          <button class="choice-chip" type="button" data-cat="practice" aria-pressed="false">현장실습</button>
          <button class="choice-chip" type="button" data-cat="extra" aria-pressed="false">비교과</button>
        </div>
        <!-- [11/23 주제별 묶기] 국제교류 = 나라, 현장실습 = 기관 유형 칩 줄(note.js가 채움, 비교과·전체는 없음) -->
        <div class="filter-row" id="groupChips" role="group" hidden></div>
      </div>

      <p class="note-count" id="noteCount" aria-live="polite"></p>
      <div class="note-list" id="noteList" aria-busy="true"></div>
    </main>

    <!-- 하단 탭(5-3) — 1단계 화면에만 -->
    <nav class="tabbar" aria-label="주 메뉴">
      <a class="tabbar__item" href="../talk/"><i data-lucide="message-circle" class="icon"></i>인터BOO</a>
      <a class="tabbar__item" href="../note/" aria-current="page"><i data-lucide="notebook-text" class="icon"></i>해봤노트</a>
      <a class="tabbar__item" href="../senior/"><i data-lucide="users" class="icon"></i>닮은선배</a>
      <a class="tabbar__item" href="../questions/"><i data-lucide="archive" class="icon"></i>내 보관함</a>
    </nav>
  </section>

  <!-- ===== 2단계: 해봤노트 상세 (상세 헤더 + 하단 탭 숨김, 5-2) ===== -->
  <section id="viewDetail" hidden>
    <header class="header">
      <button class="icon-btn" id="detailBack" type="button" aria-label="뒤로"><i data-lucide="arrow-left" class="icon"></i></button>
      <h2 class="header__title" id="detailTitle">해봤노트</h2>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <main class="page">
      <div class="detail" id="detailBody" aria-busy="true"></div>
    </main>
  </section>

  <!-- ===== 신고 바텀시트 (5-10) — 화면 위에 덮임 ===== -->
  <div class="sheet-layer" id="reportSheet" hidden>
    <div class="sheet-scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="reportTitle" tabindex="-1">
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title" id="reportTitle">이 문장을 신고할까요?</h2>
      <div class="sheet__body">
        <p class="report-quote" id="reportQuote" hidden></p>
        <p class="sub">신고하면 이 문장은 바로 숨겨지고, 담당 부서가 확인해요.</p>
        <div class="choice-list" id="reportReasons" role="group" aria-label="신고 사유"></div>
      </div>
      <div class="sheet__footer">
        <button class="btn btn--danger btn--block" id="reportSubmit" type="button" disabled>신고하기</button>
        <p class="btn-reason" id="reportReason"><i data-lucide="info" class="icon"></i><span>사유를 하나 골라 주세요</span></p>
        <button class="btn btn--text" id="reportCancel" type="button">취소</button>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>
</div>

<script src="../../assets/lucide/lucide.min.js"></script>
<script type="module" src="./note.js"></script>
<!-- 헤더 종의 새 소식 점(안 읽은 알림·쪽지, 11/24) — 내 보관함 폴더의 공통 모듈 -->
<script type="module" src="../questions/bell.js"></script>
<script type="module" src="../info/info.js"></script>
</body>
</html>

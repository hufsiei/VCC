<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인터BOO · 외대人사이드</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  /* 인터BOO 화면 배치용. 색은 style.css 변수만 쓴다. */
  .talk-top { display: flex; flex-direction: column; gap: var(--space-md); }
  .talk-panel { display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-lg); }
  /* 고정 입력줄(dock)에 마지막 말풍선이 가리지 않게: 높이는 talk.js가 잰다 */
  #viewMain .page { padding-bottom: calc(var(--dock-h, 120px) + var(--space-md)); }
  #viewSummary .page { padding-bottom: calc(var(--dock-h, 180px) + var(--space-md)); }
  /* 근거 블록이 들어가는 BOO 답변은 말풍선보다 넓게 */
  .msg__body--wide { flex: 1; max-width: calc(100% - 44px); }
  .msg__bubble p + p { margin-top: var(--space-sm); }
  .line-fallback { margin-left: var(--space-xs); vertical-align: middle; }
  .chip-row { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .chip-row .btn { min-height: 44px; font-size: var(--font-size-secondary); border-radius: var(--radius-pill); }
  .summary-top { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .empty { display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); padding: var(--space-lg) 0; text-align: center; }
  .empty__title { font-size: var(--font-size-card-title); font-weight: 600; color: var(--color-heading); }
  .dock__buttons { display: flex; flex-direction: column; gap: var(--space-sm); }
  /* 진행 칩 줄은 대화를 내려도 헤더 바로 아래에 붙어 있게(틀 고정) */
  #chips {
    position: sticky;
    top: var(--header-height);
    z-index: 5;
    margin: 0 calc(-1 * var(--page-gutter));
    padding: var(--space-sm) var(--page-gutter);
    background: var(--color-background);
    border-bottom: 1px solid var(--color-border);
  }
  /* 질문이 끝난 뒤 진행 칩을 눌러 칸을 골라 이어서 쓰기: 칩 32px + 위아래 6px = 터치 영역 44px(칩 줄 위아래 여백 8px 안) */
  button.progress-chip { position: relative; font: inherit; font-size: var(--font-size-secondary); font-weight: 500; cursor: pointer; }
  button.progress-chip::after { content: ""; position: absolute; inset: -6px 0; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 1단계: 인터BOO (메인 헤더 + 하단 탭) ===== -->
  <section id="viewMain" class="has-tabbar">
    <header class="header">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="메뉴"><i data-lucide="menu" class="icon"></i></button>
      <a class="header__brand" href="../talk/">
        <img class="header__symbol" src="../../assets/hufs-symbol.gif" alt="HUFS 심벌">
        외대人사이드
      </a>
      <div class="header__actions">
        <!-- 직원 계정일 때만 보임(5-1): PC 관리자 콘솔을 새 탭으로 -->
        <a class="icon-btn" id="consoleBtn" href="../admin/" target="_blank" rel="noopener" aria-label="관리자 콘솔" hidden><i data-lucide="chart-column" class="icon"></i></a>
        <a class="icon-btn" href="../questions/#alerts" aria-label="알림"><i data-lucide="bell" class="icon"></i></a>
      </div>
    </header>

    <main class="page">
      <div class="talk-top">
        <div class="page-intro">
          <div class="page-intro__text">
            <h1 class="page-title">인터BOO</h1>
            <p class="sub" id="modeDesc">선배들의 해봤노트를 근거로 답해 드려요.</p>
          </div>
          <img class="boo-illust" src="../../assets/boo-portrait.png" alt="BOO">
        </div>

        <div class="segment" role="tablist" aria-label="인터BOO 모드">
          <button class="segment__btn" id="tabTell" type="button" role="tab" aria-controls="panelTell" aria-selected="false">들려주기</button>
          <button class="segment__btn" id="tabAsk" type="button" role="tab" aria-controls="panelAsk" aria-selected="true">물어보기</button>
        </div>
      </div>

      <!-- 물어보기 -->
      <div class="talk-panel" id="panelAsk" role="tabpanel" aria-labelledby="tabAsk">
        <div class="chat" id="askChat" aria-live="polite"></div>
      </div>

      <!-- 들려주기 -->
      <div class="talk-panel" id="panelTell" role="tabpanel" aria-labelledby="tabTell" hidden>
        <div id="tellNotice"></div>
        <div class="progress-chips" id="chips" aria-label="노트 틀 진행" hidden></div>
        <div class="chat" id="tellChat" aria-live="polite"></div>
      </div>
    </main>

    <!-- 하단 탭 위 고정: (들려주기) AI 요약 바 + 입력줄 -->
    <div class="dock" id="mainDock">
      <div id="summaryArea" hidden>
        <div class="summary-bar">
          <span class="summary-bar__text"><i data-lucide="sparkles" class="icon"></i><span id="summaryCount">노트 틀 0/7 채움</span></span>
          <button class="summary-bar__btn" id="summaryBtn" type="button" disabled><i data-lucide="sparkles" class="icon"></i>AI 요약</button>
        </div>
        <p class="btn-reason" id="summaryReason"><i data-lucide="lock" class="icon"></i>한 항목 이상 이야기하면 요약할 수 있어요</p>
      </div>
      <form class="composer" id="composer">
        <input class="input" id="composerInput" autocomplete="off" aria-label="메시지 입력">
        <button class="send-btn" id="sendBtn" type="submit" aria-label="보내기" disabled><i data-lucide="arrow-up" class="icon"></i></button>
      </form>
    </div>

    <nav class="tabbar" aria-label="주 메뉴">
      <a class="tabbar__item" href="../talk/" aria-current="page"><i data-lucide="message-circle" class="icon"></i>인터BOO</a>
      <a class="tabbar__item" href="../note/"><i data-lucide="notebook-text" class="icon"></i>해봤노트</a>
      <a class="tabbar__item" href="../senior/"><i data-lucide="users" class="icon"></i>닮은선배</a>
      <a class="tabbar__item" href="../questions/"><i data-lucide="archive" class="icon"></i>내 보관함</a>
    </nav>
  </section>

  <!-- ===== 2단계: AI 요약 미리보기 (상세 헤더, 하단 탭 숨김 — 5-2, 7-②) ===== -->
  <section id="viewSummary" hidden>
    <header class="header">
      <button class="icon-btn" id="summaryBack" type="button" aria-label="뒤로"><i data-lucide="arrow-left" class="icon"></i></button>
      <h1 class="header__title">AI 요약 미리보기</h1>
    </header>
    <main class="page">
      <div class="summary-top">
        <img class="boo-illust boo-illust--sm" src="../../assets/boo-portrait.png" alt="BOO">
        <div id="summaryStatus"></div>
      </div>
      <div id="summaryBody" style="margin-top: var(--space-lg)"></div>
    </main>
    <div class="dock dock--bottom" id="summaryDock">
      <div class="dock__buttons">
        <button class="btn btn--primary btn--block" id="shareBtn" type="button" disabled>해봤노트에 공유</button>
        <button class="btn btn--secondary btn--block" id="laterBtn" type="button" disabled>나중에 할게요</button>
        <button class="btn btn--text" id="continueBtn" type="button">대화 이어가기</button>
      </div>
    </div>
  </section>

  <!-- ===== 공개 동의 바텀시트 (7-② · 8절, 작업 70) — 화면 이동이 아니라 위에 덮임. 내용은 consent.js가 채운다 ===== -->
  <div class="sheet-layer" id="consentSheet" hidden>
    <div class="sheet-scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="consentTitle" tabindex="-1">
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title" id="consentTitle">해봤노트 공개 동의</h2>
      <div class="sheet__body">
        <!-- 공유 후 서버가 일부 문장을 거절했을 때 결과(saveConsent.rejected) -->
        <div class="consent-result" id="consentResult" role="status" hidden></div>
        <!-- ① 반영될 해봤노트 -->
        <div class="consent-target" id="consentTarget"></div>
        <!-- ② 칸별 문장 + 공개 스위치 -->
        <div>
          <p class="sub">문장마다 공개할지 골라 주세요. 끈 문장은 내 경험노트에만 남아요.</p>
          <div class="consent-lines" id="consentLines"></div>
        </div>
        <!-- ③ 공개되는 것 / 공개되지 않는 것 -->
        <div class="consent-scope" id="consentScope"></div>
        <!-- ④ 동의 체크 -->
        <label class="check-row">
          <input class="checkbox" type="checkbox" id="consentAgree">
          <span>위 내용을 확인했고, 켠 문장을 해봤노트에 공개하는 데 동의해요.</span>
        </label>
        <div id="consentError" class="consent-error" role="alert"></div>
      </div>
      <div class="sheet__footer">
        <button class="btn btn--primary btn--block" id="consentSubmit" type="button" disabled>동의하고 공유</button>
        <p class="btn-reason" id="consentReason"><i data-lucide="info" class="icon"></i><span></span></p>
        <button class="btn btn--text" id="consentCancel" type="button">취소</button>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>
</div>

<script src="../../assets/lucide/lucide.min.js"></script>
<script type="module" src="./talk.js"></script>
<script type="module" src="./consent.js"></script>
</body>
</html>

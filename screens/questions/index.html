<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 보관함 · 외대人사이드</title>
<link rel="stylesheet" href="../../common/style.css">
<style>
  /* 내 보관함 화면 배치용. 색은 style.css 변수만 쓴다. */
  .inbox-top { display: flex; flex-direction: column; gap: 12px; }
  .inbox-top .status-label { align-self: flex-start; }

  /* 상단 탭(7-⑥): 활성 NAVY 600 + 아래 2px NAVY 밑줄, 비활성 TEXT MUTED, 탭 영역 하단 1px BORDER */
  .top-tabs {
    display: flex;
    margin: var(--space-lg) calc(-1 * var(--page-gutter)) 0;
    padding: 0 var(--page-gutter);
    border-bottom: 1px solid var(--color-border);
  }
  .top-tab {
    position: relative;
    flex: 1 1 auto; /* 4탭(11/24 쪽지 추가): 글자 길이만큼 나눠 「내 경험노트」가 꺾이지 않게 */
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
    min-height: 48px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--color-text-muted);
    font-size: var(--font-size-body);
    cursor: pointer;
  }
  .top-tab[aria-selected="true"] { border-bottom-color: var(--color-hufs-navy); color: var(--color-hufs-navy); font-weight: 600; }
  .top-tab__count { font-size: var(--font-size-secondary); font-variant-numeric: tabular-nums; }
  /* 새 소식 점: 이름 오른쪽 위 6px 오류색 */
  .top-tab__label { position: relative; }
  .top-tab__dot {
    position: absolute;
    top: -2px;
    right: -8px;
    width: 6px;
    height: 6px;
    border-radius: var(--radius-pill);
    background: var(--status-error-fg);
  }

  .tab-panel { display: flex; flex-direction: column; gap: 12px; margin-top: var(--space-md); }
  .inbox-skeleton { height: 140px; }
  a.note-card__body { color: inherit; text-decoration: none; }

  /* 내 경험노트 카드 */
  .mynote__body { display: flex; flex-direction: column; gap: var(--space-sm); padding: var(--space-md); }
  .mynote__meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-sm); font-size: var(--font-size-secondary); color: var(--color-text-muted); }

  /* 질문 카드 */
  .question { display: flex; flex-direction: column; gap: var(--space-sm); }
  .question .status-label { align-self: flex-start; }
  .question__text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-weight: 600;
    color: var(--color-text);
  }
  .question__date { font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .question__info { font-size: var(--font-size-secondary); color: var(--color-text-muted); }
  .question .btn-row { margin-top: var(--space-xs); }
  .question .btn-row .btn { font-size: var(--font-size-secondary); }
  /* [작업 118] 분야 띠가 있는 질문 카드·상세: 띠 아래 흰 본문. 분야를 모르면 중립 띠 */
  .question-card__body { padding: var(--space-md); }
  .question-band--none { background: var(--color-neutral-bg); }
  .question-band--none .note-card__kind { color: var(--status-neutral-fg); }

  /* 알림 목록(8절): 행 = 아이콘 + 문장 + 시간, 안 읽은 알림은 SOFT BLUE */
  .alert-list { display: flex; flex-direction: column; margin: 0 calc(-1 * var(--page-gutter)); }
  .alert-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    min-height: 64px;
    padding: var(--space-md) var(--page-gutter);
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
    color: inherit;
    text-decoration: none;
  }
  .alert-row--unread { background: var(--color-soft-blue); }
  .alert-row > .icon { margin-top: 2px; color: var(--color-hufs-navy); }
  .alert-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-xs); }
  .alert-row__time { font-size: var(--font-size-caption); color: var(--color-text-muted); }

  /* 카드 제목·질문 문장이 상세로 가는 링크 */
  a.link-plain { color: inherit; text-decoration: none; }
  a.link-plain:hover { text-decoration: underline; }

  /* ---------- 2단계 상세 공통 ---------- */
  .detail { display: flex; flex-direction: column; gap: var(--space-md); }
  .detail-skeleton { height: 120px; }
  .label-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
  .detail-actions { display: flex; flex-direction: column; gap: var(--space-sm); }
  .shared-mark { align-self: flex-start; }
  /* [11/23 고치기] 내 경험노트 문장 고치기 — 라벨 줄과 Text 버튼(터치 44px) */
  .line-marks { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .line-edit { align-self: flex-start; min-height: 44px; padding: 0; font-size: var(--font-size-secondary); }
  .line-edit .icon { width: 14px; height: 14px; }
  /* [11/23 추천] 「닮은선배로 추천받기」 스위치 줄 */
  .recommend-setting { display: flex; flex-direction: column; gap: var(--space-xs); padding: 12px var(--space-md); border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-surface); }
  .recommend-setting__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); }
  .recommend-setting__label { font-size: var(--font-size-body); font-weight: 600; color: var(--color-heading); }
  .question-head { display: flex; flex-direction: column; gap: var(--space-sm); }
  .question-head .status-label { align-self: flex-start; }
  .question-head__text { font-size: var(--font-size-card-title); font-weight: 600; line-height: 1.4; color: var(--color-heading); }
  /* 선배 답(A) — 해봤노트 상세와 같은 모양 */
  .line { display: flex; flex-direction: column; gap: var(--space-sm); padding: var(--space-md); border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-surface); }
  .line__meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-sm); font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .qa__mark { flex: none; font-weight: 700; color: var(--color-hufs-navy); }
  .qa__a { display: flex; gap: var(--space-sm); }
  .qa__a-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-sm); }

  .state-box { display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); padding: var(--space-lg) 0; text-align: center; }
  .state-box__title { font-size: var(--font-size-card-title); font-weight: 600; color: var(--color-heading); }
  .state-box .boo-illust { width: 80px; height: 80px; }

  /* ---------- 쪽지 탭(11/24 닮은선배 · 내 쪽지에서 옮김) ---------- */
  .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--status-error-fg); color: var(--color-on-primary); font-size: var(--font-size-caption); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tab-panel > .section-title { margin-top: var(--space-sm); }
  .msg-group { display: flex; flex-direction: column; gap: 12px; }
  .thread-row { display: flex; align-items: flex-start; gap: 12px; color: inherit; text-decoration: none; cursor: pointer; }
  .thread-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-xs); }
  .thread-row__name { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); font-weight: 600; color: var(--color-heading); }
  .thread-row__last { overflow: hidden; color: var(--color-text-muted); font-size: var(--font-size-secondary); white-space: nowrap; text-overflow: ellipsis; }
  .thread-row__time { font-size: var(--font-size-caption); color: var(--color-text-muted); }
  .thread-row--muted .thread-row__name { color: var(--color-text-muted); }
  .request-card { display: flex; flex-direction: column; gap: 12px; }
  .request-card__who { font-weight: 600; color: var(--color-heading); }
  .request-card__text { padding: var(--space-sm) 12px; border-radius: var(--radius-card); background: var(--color-neutral-bg); }

  /* ---------- 2단계: 쪽지 대화 ---------- */
  .thread-page { padding-bottom: calc(var(--button-height) + 88px); }
  .thread-top { display: flex; flex-direction: column; gap: var(--space-sm); margin-bottom: var(--space-md); }
  .thread-top .status-label { align-self: flex-start; }
  .msg--them .msg__body { max-width: calc(100% - 48px); }
  .dock .composer .input { flex: 1; }
  .dock-note { display: flex; flex-direction: column; gap: var(--space-sm); }
  .dock-note .btn-reason { justify-content: center; margin-top: 0; }
  #threadMenu[hidden], #threadMenuSpacer[hidden] { display: none; }
  #reportBlockRow[hidden] { display: none; }
  /* 쪽지 검사 주의: 라벨(한 줄) + 그 아래 14px 문구 */
  .check-warn { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-xs); }
  .check-warn[hidden] { display: none; }
  .check-warn__text { font-size: var(--font-size-secondary); }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 1단계: 내 보관함 (메인 헤더 + 하단 탭) ===== -->
  <section id="viewInbox" class="has-tabbar">
    <header class="header">
      <button class="icon-btn" id="logoutBtn" type="button" aria-label="로그아웃"><i data-lucide="log-out" class="icon icon--mirror"></i></button>
      <a class="header__brand" href="../talk/">
        <img class="header__symbol" src="../../assets/hufs-symbol.gif" alt="HUFS 심벌">
        외대人사이드
      </a>
      <div class="header__actions">
        <!-- 직원 계정일 때만 보임(5-1): PC 관리자 콘솔을 새 탭으로 -->
        <a class="icon-btn" id="consoleBtn" href="../admin/" target="_blank" rel="noopener" aria-label="관리자 콘솔" hidden><i data-lucide="chart-column" class="icon"></i></a>
        <a class="icon-btn" id="bellBtn" href="#alerts" aria-label="알림"><i data-lucide="bell" class="icon"></i><span class="icon-btn__dot" id="bellDot" hidden></span></a>
      </div>
    </header>

    <main class="page">
      <div class="inbox-top">
        <h1 class="page-title">내 보관함</h1>
        <p class="sub">내 경험노트, 질문, 쪽지, 담아 둔 해봤노트를 모아 봐요.</p>
        <span class="status-label status-label--info"><i data-lucide="lock" class="icon"></i>나만 보기</span>
      </div>

      <div class="top-tabs" role="tablist" aria-label="내 보관함">
        <button class="top-tab" type="button" role="tab" id="tab-notes" data-tab="notes" aria-controls="tabPanel" aria-selected="true">
          <span class="top-tab__label">내 경험노트<span class="top-tab__dot" hidden></span></span><span class="top-tab__count"></span>
        </button>
        <button class="top-tab" type="button" role="tab" id="tab-questions" data-tab="questions" aria-controls="tabPanel" aria-selected="false">
          <span class="top-tab__label">질문함<span class="top-tab__dot" hidden></span></span><span class="top-tab__count"></span>
        </button>
        <button class="top-tab" type="button" role="tab" id="tab-messages" data-tab="messages" aria-controls="tabPanel" aria-selected="false">
          <span class="top-tab__label">쪽지<span class="top-tab__dot" hidden></span></span><span class="top-tab__count"></span>
        </button>
        <button class="top-tab" type="button" role="tab" id="tab-scraps" data-tab="scraps" aria-controls="tabPanel" aria-selected="false">
          <span class="top-tab__label">스크랩<span class="top-tab__dot" hidden></span></span><span class="top-tab__count"></span>
        </button>
      </div>

      <div class="tab-panel" id="tabPanel" role="tabpanel" aria-busy="true"></div>
    </main>

    <!-- 하단 탭(5-3) — 1단계 화면에만 -->
    <nav class="tabbar" aria-label="주 메뉴">
      <a class="tabbar__item" href="../talk/"><i data-lucide="message-circle" class="icon"></i>인터BOO</a>
      <a class="tabbar__item" href="../note/"><i data-lucide="notebook-text" class="icon"></i>해봤노트</a>
      <a class="tabbar__item" href="../senior/"><i data-lucide="users" class="icon"></i>닮은선배</a>
      <a class="tabbar__item" href="../questions/" aria-current="page"><i data-lucide="archive" class="icon"></i>내 보관함</a>
    </nav>
  </section>

  <!-- ===== 2단계: 알림 목록 (상세 헤더 + 하단 탭 숨김, 5-2·8절) ===== -->
  <section id="viewAlerts" hidden>
    <header class="header">
      <button class="icon-btn" data-back type="button" aria-label="뒤로"><i data-lucide="arrow-left" class="icon"></i></button>
      <h2 class="header__title">알림</h2>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <main class="page">
      <div id="alertsBody"></div>
    </main>
  </section>

  <!-- ===== 2단계: 내 경험노트 상세 (8절) ===== -->
  <section id="viewMyNote" hidden>
    <header class="header">
      <button class="icon-btn" data-back type="button" aria-label="뒤로"><i data-lucide="arrow-left" class="icon"></i></button>
      <h2 class="header__title" id="myNoteTitle">내 경험노트</h2>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <main class="page">
      <div class="detail" id="myNoteBody" aria-busy="true"></div>
    </main>
  </section>

  <!-- ===== 2단계: 질문 상세 (8절) ===== -->
  <section id="viewQuestion" hidden>
    <header class="header">
      <button class="icon-btn" data-back type="button" aria-label="뒤로"><i data-lucide="arrow-left" class="icon"></i></button>
      <h2 class="header__title">질문</h2>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <main class="page">
      <div class="detail" id="questionBody" aria-busy="true"></div>
    </main>
  </section>

  <!-- ===== 2단계: 익명 쪽지 대화 (상세 헤더 + 채팅, 8절 — 11/24 닮은선배에서 옮김) ===== -->
  <section id="viewThread" hidden>
    <header class="header">
      <button class="icon-btn" data-back type="button" aria-label="뒤로"><i data-lucide="arrow-left" class="icon"></i></button>
      <h2 class="header__title" id="threadTitle">쪽지</h2>
      <!-- 쪽지 ⋮ 메뉴(5-2 보조 아이콘, 8절 익명 쪽지 대화): 신고·차단 -->
      <button class="icon-btn" id="threadMenu" type="button" aria-label="신고·차단 메뉴" aria-haspopup="dialog" hidden><i data-lucide="ellipsis-vertical" class="icon"></i></button>
      <span class="icon-btn" id="threadMenuSpacer" aria-hidden="true"></span>
    </header>
    <main class="page thread-page">
      <div id="threadTop"></div>
      <div class="chat" id="threadChat" aria-live="polite"></div>
    </main>
    <div class="dock dock--bottom" id="threadDock"></div>
  </section>

  <!-- ===== 확인 바텀시트 (5-10) — 요청 취소·차단처럼 되돌리기 어려운 동작 ===== -->
  <div class="sheet-layer" id="confirmSheet" hidden>
    <div class="sheet-scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" tabindex="-1">
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title" id="confirmTitle">확인</h2>
      <div class="sheet__body"><p id="confirmText"></p></div>
      <div class="sheet__footer">
        <button class="btn btn--primary btn--block" id="confirmOk" type="button">확인</button>
        <button class="btn btn--text" id="confirmCancel" type="button">닫기</button>
      </div>
    </div>
  </div>

  <!-- ===== 신고·차단 바텀시트 (5-10 신고 사유 선택, 8절 익명 쪽지 대화 ⋮) — 차단은 확인 시트를 한 번 더 ===== -->
  <div class="sheet-layer" id="reportSheet" hidden>
    <div class="sheet-scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="reportTitle" tabindex="-1">
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title" id="reportTitle">이 대화를 신고할까요?</h2>
      <div class="sheet__body">
        <p class="sub">신고하면 담당자가 확인해요. 상대에게는 알리지 않아요.</p>
        <div class="choice-list" id="reportReasons" role="group" aria-label="신고 사유"></div>
        <label class="check-row" id="reportBlockRow">
          <input class="checkbox" id="reportBlock" type="checkbox">
          <span>차단도 하기 · 이 대화에서 두 사람 모두 더 쪽지를 보낼 수 없어요</span>
        </label>
      </div>
      <div class="sheet__footer">
        <button class="btn btn--danger btn--block" id="reportSubmit" type="button" disabled>신고하기</button>
        <p class="btn-reason" id="reportHint"><i data-lucide="info" class="icon"></i><span>사유를 고르거나 차단을 선택해 주세요</span></p>
        <button class="btn btn--text" id="reportCancel" type="button">취소</button>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>
</div>

<script src="../../assets/lucide/lucide.min.js"></script>
<script type="module" src="./questions.js"></script>
<!-- 공개 동의 시트(작업 70, 11/22 common으로 옮김): 마크업은 이 파일이 만든다. open-consent로 열고 consent-saved로 끝을 받는다 -->
<script type="module" src="../../common/consent.js"></script>
</body>
</html>
